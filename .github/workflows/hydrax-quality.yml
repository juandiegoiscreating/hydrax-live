name: HYDRAX quality smoke
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hydrax-quality.yml"
      - "scripts/hydrax-backtest.mjs"
      - "hydrax-quantum-final.html"
      - "tracker.html"
      - "supabase/functions/hydrax-public-intelligence/index.ts"
permissions:
  contents: read
jobs:
  frontend-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        run: |
          node - <<'JS'
          const fs=require("fs");
          const html=fs.readFileSync("hydrax-quantum-final.html","utf8");
          const js=html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if(!js)throw Error("Missing frontend JS");
          new Function(js);
          console.log("FRONTEND_SYNTAX_OK");
          JS
      - name: Check tracker JavaScript syntax and bankroll controls
        run: |
          node - <<'JS'
          const fs=require("fs");
          const cp=require("child_process");
          const html=fs.readFileSync("tracker.html","utf8");
          const js=html.match(/<script type="module">([\s\S]*?)<\/script>/)?.[1];
          if(!js)throw Error("Tracker module missing");
          const check=cp.spawnSync(process.execPath,["--input-type=module","--check"],{input:js,encoding:"utf8"});
          if(check.status!==0)throw Error(check.stderr||"Tracker JS syntax failed");
          if(!html.includes('id="bankroll"')||!html.includes('id="unitSize"'))throw Error("Capital tracker missing");
          if(!html.includes("DEFAULT_URL")||!html.includes("DEFAULT_KEY"))throw Error("Auto configuration missing");
          console.log("TRACKER_SYNTAX_AND_CONTROLS_OK");
          JS
      - name: Check model backtest script syntax
        run: node --check scripts/hydrax-backtest.mjs
      - name: Check current quote freshness invariant
        run: |
          node - <<'JS'
          const fs=require("fs");
          const text=fs.readFileSync("supabase/functions/hydrax-public-intelligence/index.ts","utf8");
          if(!text.includes("MODEL_CACHE_VERSION=12"))throw Error("Backend cache version mismatch");
          if(!text.includes("function deliverSnapshot("))throw Error("Missing fresh quote validation");
          if(!text.includes("now-quote<=30*60000"))throw Error("Missing 30 minute quote cutoff");
          if(text.includes("Upgrade prior cached quotes"))throw Error("Unsafe legacy snapshot upgrade detected");
          console.log("CACHE_SAFETY_CHECK_OK");
          JS
      - name: Probe HYDRAX API read-only status
        run: |
          node --input-type=module - <<'JS'
          const r=await fetch("https://acpwxupqpbyesbhuixkq.supabase.co/functions/v1/hydrax-public-intelligence",{signal:AbortSignal.timeout(15000)});
          if(!r.ok)throw Error("HYDRAX API status "+r.status);
          const j=await r.json();
          if(j.service!=="HYDRAX_PUBLIC_INTELLIGENCE" || j.authRequired!==false || j.modelCacheVersion!==12 || j.marketFreshnessPolicyMinutes!==30)throw Error("Unexpected API health shape");
          console.log({service:j.service,modelVersion:j.modelVersion,modelAudit:j.modelAudit?.status});
          JS

      - name: Live NBA research smoke (never places wagers)
        run: |
          node --input-type=module - <<'JS'
          const url="https://acpwxupqpbyesbhuixkq.supabase.co/functions/v1/hydrax-public-intelligence";
          const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({sport:"NBA"}),signal:AbortSignal.timeout(65000)});
          const data=await r.json();
          if(r.status===429 && data.error==="DAILY_SOURCE_LIMIT"){
            console.log("NBA_RESEARCH_QUOTA_REACHED: live provider test deferred; GET health passed");
            process.exit(0);
          }
          if(!r.ok||data.ok!==true||data.sport!=="NBA"||!Array.isArray(data.picks)){
            throw Error("HYDRAX_NBA_SMOKE_FAILED: HTTP "+r.status+" "+JSON.stringify(data).slice(0,700));
          }
          if(data.modelCacheVersion!==12)throw Error("Incorrect cache version");
          const now=Date.now();
          for(const p of data.picks){
            const stamp=Date.parse(p.priceUpdatedAt||"");
            const start=Date.parse(p.startsAt||"");
            if(!Number.isFinite(stamp)||stamp>now+120000||now-stamp>30*60000||!Number.isFinite(start)||start<=now||p.odds<-400){
              throw Error("Expired or outside-policy pick returned");
            }
          }
          console.log("NBA_LIVE_SMOKE_OK",{events:data.eventsCount,picks:data.picks.length,fromCache:data.fromCache});
          JS

      - name: One-time full sports verification
        if: github.event.head_commit.message == 'HYDRAX one-time eight-sport QA'
        run: |
          node --input-type=module - <<'JS'
          const sports=["UFC","ATP","WTA","NBA","NFL","MLB","NCAAB","NCAAF"];
          const url="https://acpwxupqpbyesbhuixkq.supabase.co/functions/v1/hydrax-public-intelligence";
          const findings=[];
          for(const sport of sports){
            try {
              const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({sport}),signal:AbortSignal.timeout(65000)});
              const d=await r.json();
              if(r.status===429&&d.error==="DAILY_SOURCE_LIMIT"){
                findings.push({sport,status:"QUOTA_LIMIT",picks:0});
                continue;
              }
              if(!r.ok||d.ok!==true||d.sport!==sport||!Array.isArray(d.picks))throw Error("HTTP "+r.status+" "+JSON.stringify(d).slice(0,500));
              if(d.modelCacheVersion!==12)throw Error("Incorrect model cache version");
              const now=Date.now();
              for(const p of d.picks){
                const quote=Date.parse(p.priceUpdatedAt||"");
                const starts=Date.parse(p.startsAt||"");
                if(!Number.isFinite(quote)||now-quote>30*60000||quote>now+120000||starts<=now||p.odds<-400)throw Error("Unsafe quote");
              }
              findings.push({sport,status:"OK",events:d.eventsCount,picks:d.picks.length,notes:d.warning?.slice(0,100)});
            }catch(e){findings.push({sport,status:"ERROR",error:String(e)});}
          }
          console.log(JSON.stringify(findings,null,2));
          const failures=findings.filter(x=>x.status==="ERROR");
          if(failures.length)throw Error("Incomplete sports verification: "+failures.map(x=>x.sport).join(","));
          JS
